version: '3.8'

services:
  postgres:
    build: ./database
    container_name: trip-planner-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: tripplanner
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./database/scripts:/docker-entrypoint-initdb.d/scripts
    networks:
      - trip-planner-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  pgadmin:
    image: dpage/pgadmin4
    container_name: trip-planner-pgadmin
    depends_on:
      - postgres
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - trip-planner-network

  backend:
    build: ./backend
    container_name: trip-planner-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tripplanner
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    networks:
      - trip-planner-network

  frontend:
    build: ./frontend
    container_name: trip-planner-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      REACT_APP_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - trip-planner-network

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  trip-planner-network:
    driver: bridge
